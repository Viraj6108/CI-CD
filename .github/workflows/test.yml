name: Java CI
#  runs every time code is pushed to main repository 
on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
# checkouts the code on github runner
      - name: Checkout Code
        uses: actions/checkout@v4
# installs java on runner 
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Project
        run: mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with: 
          name: springboot-jar
          path: target/*.jar
          retention-day: 7
      - name : upload test reports background
        uses: actions/upload-artifact@v4
        with: 
          name: test-reports 
          path: target/surefire-reports


#  docker login and build image using docker username and pass cred from GitHUB secrets 
#  this will only work in manual docker 
      # - name: docker login
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{secrets.DOCKER_PASS }}

      # - name: build and push image
      #   uses: docker/build-push-action@v5
      #   with: 
      #     context: .
      #     push: true
      #     tags: | 
      #        ${{secrets.DOCKER_USERNAME}}/demo-app:latest
      #        ${{secrets.DOCKER_USERNAME}}/demo-app:${{ github.sha }}


      #   # verfiy docker image 
      # - name: image verification
      #   run: docker images
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: build docker image
        run: |
          docker build -t demo-app .
          docker tag demo-app:latest:${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha}}

      - name: push docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha}}
